name = "el-batlle-comptes"
main = "comptes.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "COMPTES"
class_name = "Compte"

[[durable_objects.bindings]]
name = "PORTERS"
class_name = "Porter"

[[durable_objects.bindings]]
name = "REGISTRE"
class_name = "Registre"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Compte", "Porter"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Registre"]
